name: Publish npm package

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing signed tag to publish after a workflow-only repair
        required: true
        type: string

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: production
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.4.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - name: Use an npm CLI with trusted publishing support
        run: npm install --global npm@11.17.0
      - name: Verify signed release identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          test "${RELEASE_TAG}" = "v${PACKAGE_VERSION}"
          TAG_OBJECT="$(git rev-parse "refs/tags/${RELEASE_TAG}^{tag}")"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${TAG_OBJECT}" --jq '.verification.verified')" = "true"
      - name: Test and build framework-free proxy API
        run: |
          pnpm install --frozen-lockfile
          pnpm test
          pnpm tsc --noEmit
          pnpm build:lib
          npm pack --dry-run
      - name: Publish with npm provenance
        run: npm publish --access public
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${RELEASE_TAG}" --verify-tag --generate-notes --title "${RELEASE_TAG}"
