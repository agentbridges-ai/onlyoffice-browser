name: Pull request checks

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: onlyoffice-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
        with:
          version: 11.4.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify public API, runtime and pack contents
        run: |
          pnpm test
          pnpm tsc --noEmit
          pnpm lint
          pnpm format:check
          pnpm build:lib
          npm pack --dry-run --ignore-scripts
          pnpm build
          node scripts/verify-release-publication.mjs --release-root .onlyoffice-release --expected-package-version "$(node -p "require('./package.json').version")" --fastcdc-evidence-mode automatic
