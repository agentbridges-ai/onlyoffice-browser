name: Deploy runtime to R2

on:
  push:
    branches: [main]
    tags:
      - "v*"
    paths:
      - "bin/**"
      - "public/**"
      - "scripts/**"
      - "src/**"
      - "test/**"
      - "cloudflare/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "wrangler.jsonc"
      - ".github/workflows/deploy-r2.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: onlyoffice-r2-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      RCLONE_CONFIG_R2_TYPE: s3
      RCLONE_CONFIG_R2_PROVIDER: Cloudflare
      RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      RCLONE_CONFIG_R2_ENDPOINT: https://40a503f1c86c028edfcd6f113c562b5b.r2.cloudflarestorage.com
      RCLONE_CONFIG_R2_ACL: private
      RCLONE_CONFIG_R2_NO_CHECK_BUCKET: "true"
      ONLYOFFICE_MATRIX_FONT_RELEASE_ID: v0.5.0-648c486d1c558acd
      ONLYOFFICE_MATRIX_FONT_MANIFEST_SHA256: 09f0df58c08043aac5b576411b51bfe97584ea5b18e3eac5241b9d448631ba45
    steps:
      - uses: actions/checkout@v6
      - name: Initialize reproducible build metadata
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "${GITHUB_ENV}"
      - uses: pnpm/action-setup@v4
        with:
          version: 11.4.0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - name: Install rclone
        run: |
          sudo apt-get update
          sudo apt-get install --yes rclone
      - run: pnpm install --frozen-lockfile
      - name: Verify runtime
        run: |
          pnpm test
          pnpm tsc --noEmit
          pnpm build
          node -e "const manifest = require('./dist/onlyoffice-runtime-assets.json'); if (manifest.version !== 2 || manifest.assets.length !== manifest.selected || manifest.totalBytes <= 0) process.exit(1)"
      - run: rclone version
      - name: Hydrate the pinned immutable font release
        env:
          ONLYOFFICE_X2T_VERSION: 9.3.0+2
          ONLYOFFICE_X2T_COMMIT: 1bb9b45a399f87ca162eea0c86abd4660f295469
          ONLYOFFICE_MATRIX_FONT_CACHE: ${{ runner.temp }}/onlyoffice-font-release
        run: |
          node scripts/hydrate-cloudflare-matrix-fonts.mjs
          pnpm fonts:verify --input dist
          pnpm release:build
          node -e "const fs=require('node:fs'); const pointer=JSON.parse(fs.readFileSync('.onlyoffice-release/channels/stable.json')); const manifest=JSON.parse(fs.readFileSync('.onlyoffice-release/releases/'+pointer.releaseId+'/manifest.json')); if(manifest.version !== 4 || manifest.x2t.version !== process.env.ONLYOFFICE_X2T_VERSION || manifest.x2t.commit !== process.env.ONLYOFFICE_X2T_COMMIT) throw new Error('Office Pack/x2t release identity mismatch')"
          node -e "const fs=require('node:fs'); const pointer=JSON.parse(fs.readFileSync('.onlyoffice-release/channels/stable.json')); const manifest=JSON.parse(fs.readFileSync('.onlyoffice-release/releases/'+pointer.releaseId+'/manifest.json')); const misplaced=manifest.assets.filter(({path,profile})=>(path.startsWith('fonts/')&&!profile.startsWith('fonts-'))||path.endsWith('.br')); if(!manifest.profiles['fonts-basic']?.length||!manifest.profiles['fonts-office-compat']?.length||misplaced.length) throw new Error('release contains incomplete font profiles or duplicate compressed assets: '+misplaced.map(({path})=>path).join(','))"
          node -e "const fonts=require('./dist/onlyoffice-browser-font-assets.json'); const names=new Set((fonts.fontFamilies||[]).map(({name})=>name)); if(fonts.fontSet!=='full'||names.size<170||!names.has('Aptos')||!names.has('DengXian')||!names.has('Calibri')) throw new Error('complete Aptos/DengXian/Calibri font matrix is missing')"
      - name: Upload missing immutable objects and verify the complete release
        run: |
          rclone copy .onlyoffice-release/blobs r2:onlyoffice-getpi-work/blobs \
            --fast-list \
            --checkers 32 \
            --transfers 8 \
            --retries 6 \
            --low-level-retries 20 \
            --retries-sleep 2s \
            --ignore-existing \
            --stats-one-line
          rclone copy .onlyoffice-release/releases r2:onlyoffice-getpi-work/releases \
            --fast-list \
            --checkers 16 \
            --transfers 8 \
            --retries 6 \
            --low-level-retries 20 \
            --retries-sleep 2s \
            --ignore-existing \
            --stats-one-line
          rclone copy .onlyoffice-release/packages r2:onlyoffice-getpi-work/packages \
            --fast-list \
            --checkers 16 \
            --transfers 4 \
            --retries 6 \
            --low-level-retries 20 \
            --retries-sleep 2s \
            --ignore-existing \
            --stats-one-line
          rclone check .onlyoffice-release/blobs r2:onlyoffice-getpi-work/blobs --one-way --checksum
          rclone check .onlyoffice-release/releases r2:onlyoffice-getpi-work/releases --one-way --checksum
          rclone check .onlyoffice-release/packages r2:onlyoffice-getpi-work/packages --one-way --checksum
      - name: Update v2 compatibility files without deleting retained releases
        run: |
          rclone copy dist r2:onlyoffice-getpi-work \
            --fast-list \
            --checkers 32 \
            --transfers 8 \
            --retries 6 \
            --low-level-retries 20 \
            --retries-sleep 2s \
            --exclude "/onlyoffice-plugin/**" \
            --stats-one-line
      - name: Deploy wildcard runtime Worker
        run: |
          curl --fail --silent --show-error \
            "https://onlyoffice.getpi.work/onlyoffice-browser-font-assets.json?ci=${GITHUB_SHA}" \
            --output "${RUNNER_TEMP}/onlyoffice-browser-font-assets.json"
          node scripts/verify-deployed-font-assets.mjs \
            --manifest-url "https://onlyoffice.getpi.work/onlyoffice-browser-font-assets.json?ci=${GITHUB_SHA}"
          ASSET_VERSION="$(
            node scripts/runtime-asset-version.mjs \
              --root dist \
              --font-manifest "${RUNNER_TEMP}/onlyoffice-browser-font-assets.json"
          )"
          npx --yes wrangler@4.114.0 deploy --var "ASSET_VERSION:${ASSET_VERSION}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Switch stable release pointer
        run: |
          rclone copyto \
            .onlyoffice-release/channels/stable.json \
            r2:onlyoffice-getpi-work/channels/stable.json \
            --retries 6 \
            --low-level-retries 20 \
            --retries-sleep 2s
      - name: Verify production deployment
        run: |
          EXPECTED_VERSION="$(
            node scripts/runtime-asset-version.mjs \
              --root dist \
              --font-manifest "${RUNNER_TEMP}/onlyoffice-browser-font-assets.json"
          )"
          for attempt in $(seq 1 12); do
            ACTUAL_VERSION="$(
              curl --fail --silent --show-error --head https://onlyoffice.getpi.work/onlyoffice-runtime-assets.json |
                tr -d '\r' |
                awk -F ': ' 'tolower($1) == "x-onlyoffice-asset-version" { print $2 }'
            )"
            if [ "${ACTUAL_VERSION}" = "${EXPECTED_VERSION}" ]; then
              break
            fi
            if [ "${attempt}" = "12" ]; then
              echo "Expected asset version ${EXPECTED_VERSION}, received ${ACTUAL_VERSION:-missing}" >&2
              exit 1
            fi
            sleep 5
          done
          curl --fail --silent --show-error https://onlyoffice.getpi.work/onlyoffice-runtime-assets.json |
            node -e "let body=''; process.stdin.on('data', chunk => body += chunk).on('end', () => { const manifest = JSON.parse(body); if (manifest.version !== 2 || manifest.assets.length !== manifest.selected) process.exit(1) })"
          node scripts/verify-deployed-font-assets.mjs \
            --manifest-url "https://onlyoffice.getpi.work/onlyoffice-browser-font-assets.json?ci=${GITHUB_SHA}"
          export RELEASE_ID="$(node -p "require('./.onlyoffice-release/channels/stable.json').releaseId")"
          curl --fail --silent --show-error \
            https://onlyoffice.getpi.work/channels/stable.json |
            node -e "let body=''; process.stdin.on('data', chunk => body += chunk).on('end', () => { const pointer = JSON.parse(body); if (pointer.releaseId !== process.env.RELEASE_ID) process.exit(1) })"
          SMOKE_RESULT="$(
            curl --fail --silent --show-error --location --max-redirs 2 \
              --output /dev/null \
              --write-out "%{http_code} %{num_redirects} %{content_type}" \
              "https://office-editor-github-actions-smoke.getpi.work/r/${RELEASE_ID}/office-host.html"
          )"
          test "${SMOKE_RESULT}" = "200 0 text/html; charset=utf-8"
          PACK_RESULT="$(
            curl --fail --silent --show-error \
              --range 0-7 \
              --output "${RUNNER_TEMP}/onlyoffice-pack-magic" \
              --write-out "%{http_code} %{size_download} %{content_type}" \
              "https://onlyoffice.getpi.work/p/${RELEASE_ID}/office-resources.oobpack"
          )"
          test "${PACK_RESULT}" = "206 8 application/vnd.onlyoffice.browser-pack"
          test "$(cat "${RUNNER_TEMP}/onlyoffice-pack-magic")" = "OOBPACK1"
