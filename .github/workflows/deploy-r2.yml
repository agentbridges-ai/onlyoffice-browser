name: Promote verified runtime candidate
on:
  workflow_dispatch:
    inputs:
      confirm_promotion: { description: "Type PROMOTE", required: true, type: string }
      candidate_commit: { description: "Candidate source SHA", required: true, type: string }
      candidate_run_id: { description: "Candidate workflow run ID", required: true, type: string }
      staging_run_id: { description: "Successful stage-r2 workflow run ID", required: true, type: string }
      piwork_integration_commit: { description: "Piwork deep-verify head SHA", required: true, type: string }
      piwork_integration_run_id: { description: "Successful Piwork deep-verify run ID", required: true, type: string }
      piwork_integration_run_attempt:
        { description: "Successful Piwork deep-verify run attempt", required: true, type: string }
permissions: { contents: read, actions: read }
concurrency: { group: onlyoffice-r2-production, cancel-in-progress: false, queue: max }
jobs:
  promote:
    if: inputs.confirm_promotion == 'PROMOTE'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment: production
    env:
      RCLONE_CONFIG_R2_TYPE: s3
      RCLONE_CONFIG_R2_PROVIDER: Cloudflare
      RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      RCLONE_CONFIG_R2_ENDPOINT: https://40a503f1c86c028edfcd6f113c562b5b.r2.cloudflarestorage.com
      RCLONE_CONFIG_R2_ACL: private
      RCLONE_CONFIG_R2_NO_CHECK_BUCKET: "true"
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ inputs.candidate_commit }}
      - name: Require this production run to originate at the exact current main candidate
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = refs/heads/main
          test "${GITHUB_SHA}" = "${{ inputs.candidate_commit }}"
          test "$(git rev-parse HEAD)" = "${{ inputs.candidate_commit }}"
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: onlyoffice-runtime-candidate-${{ inputs.candidate_commit }}
          path: candidate-input
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}
      - name: Require a successful immutable candidate run
        run: |
          set -euo pipefail
          [[ "${{ inputs.candidate_commit }}" =~ ^[a-f0-9]{40}$ ]]
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${{ inputs.candidate_run_id }}" > candidate-run.json
          node -e "const r=require('./candidate-run.json'); if(r.conclusion!=='success'||r.head_sha!==process.env.SHA||!['push','workflow_dispatch'].includes(r.event)||r.head_branch!=='main'||!r.path.endsWith('/candidate-r2.yml'))throw Error('candidate run is not a successful main-branch candidate workflow for this SHA')"
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ inputs.candidate_commit }}
      - name: Verify retained candidate identity without rebuilding runtime
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ inputs.candidate_commit }}"
          test -d candidate-input/dist -a -d candidate-input/.onlyoffice-release -a -f candidate-input/release-evidence/office-release-envelope.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs'; import {validateReleaseEnvelope} from './scripts/release-envelope.mjs';
          validateReleaseEnvelope(JSON.parse(fs.readFileSync('candidate-input/release-evidence/office-release-envelope.json')));
          NODE
          node --input-type=module <<'NODE'
          import fs from 'node:fs'; import {bindExistingNpmPublication} from './scripts/release-envelope.mjs';
          const envelope=JSON.parse(fs.readFileSync('candidate-input/release-evidence/office-release-envelope.json'));
          const rebound=await bindExistingNpmPublication(envelope);
          if(rebound.npm.registry.state!=='published') throw Error('candidate npm package must be published with verified provenance before promotion');
          if(envelope.npm.registry.state==='published'&&JSON.stringify(rebound.npm.registry)!==JSON.stringify(envelope.npm.registry)) throw Error('candidate npm registry/SLSA/public API evidence is stale or forged');
          if(envelope.npm.registry.state==='not-published'&&(rebound.npm.registry.gitHead!==envelope.source.gitCommit||rebound.npm.registry.integrity!==envelope.sourcePackage?.integrity)) throw Error('new npm publication is not the exact candidate commit and source package');
          fs.writeFileSync('verified-npm-registry.json',JSON.stringify(rebound.npm.registry,null,2)+'\n');
          NODE
          node <<'NODE'
          const fs=require('node:fs'), c=require('node:crypto');
          const sha=x=>c.createHash('sha256').update(fs.readFileSync(x)).digest('hex');
          const sri=x=>'sha512-'+c.createHash('sha512').update(fs.readFileSync(x)).digest('base64');
          const e=require('./candidate-input/release-evidence/office-release-envelope.json');
          const manifest=require('./candidate-input/.onlyoffice-release/releases/'+e.runtime.releaseId+'/manifest.json');
          if(e.lifecycle!=='candidate'||e.source.gitCommit!==process.env.CANDIDATE||e.runtime.sourceCommit!==process.env.CANDIDATE||manifest.sourceCommit!==process.env.CANDIDATE||sha('candidate-input/.onlyoffice-release/releases/'+e.runtime.releaseId+'/manifest.json')!==e.runtime.manifestSha256||sha('candidate-input/dist/onlyoffice-runtime-assets.json')!==e.runtime.runtimeManifestSha256||sha('pnpm-lock.yaml')!==e.source.lockfileSha256||e.npm.packageName!=='@agentbridges-ai/onlyoffice-browser'||e.npm.version!==require('./package.json').version||!e.sourcePackage?.tarball||sri('candidate-input/release-evidence/'+e.sourcePackage.tarball)!==e.sourcePackage.integrity) throw Error('candidate envelope, manifest source, or source package integrity mismatch');
          const source=require('./candidate-input/release-evidence/source-identity.json'); const {identitySha256,...identity}=source;
          if(identity.gitCommit!==e.source.gitCommit||identity.lockfileSha256!==e.source.lockfileSha256||identity.runtimeManifestSha256!==e.runtime.runtimeManifestSha256||identity.releaseId!==e.runtime.releaseId||identity.releaseManifestSha256!==e.runtime.manifestSha256) throw Error('candidate matrix identity is not bound to the envelope');
          for (const name of ['full-v5-cloudflare-broker-matrix.json','fault-injected-proxy-matrix.json']) { const matrix=require('./candidate-input/release-evidence/'+name); if(matrix.result!=='passed'||JSON.stringify(matrix.sourceIdentity)!==JSON.stringify(identity)||matrix.sourceIdentitySha256!==identitySha256) throw Error(`candidate matrix evidence mismatch: ${name}`); }
          NODE
        env:
          CANDIDATE: ${{ inputs.candidate_commit }}
      - name: Require successful production staging evidence for this candidate
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${{ inputs.staging_run_id }}" > staging-run.json
          node -e "const r=require('./staging-run.json'); if(r.conclusion!=='success'||r.head_sha!==process.env.SHA||r.event!=='workflow_dispatch'||r.head_branch!=='main'||!r.path.endsWith('/stage-r2.yml'))throw Error('staging run is not a successful dispatched main-branch stage workflow for this candidate SHA')"
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ inputs.candidate_commit }}
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: onlyoffice-runtime-stage-${{ inputs.candidate_commit }}-${{ inputs.staging_run_id }}
          path: staged-evidence
          run-id: ${{ inputs.staging_run_id }}
          github-token: ${{ github.token }}
      - name: Bind staging evidence to this exact candidate artifact and runtime
        env:
          CANDIDATE: ${{ inputs.candidate_commit }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          STAGING_RUN_ID: ${{ inputs.staging_run_id }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const stage=require('./staged-evidence/stage-r2.json'); const envelope=require('./candidate-input/release-evidence/office-release-envelope.json'); const npmRegistry=require('./verified-npm-registry.json');
          if(stage.version!==1||stage.kind!=='current-production-worker-compatibility'||stage.candidate?.commit!==process.env.CANDIDATE||String(stage.candidate?.runId)!==process.env.CANDIDATE_RUN_ID||String(stage.production?.runId)!==process.env.STAGING_RUN_ID||stage.production?.repository!==process.env.GITHUB_REPOSITORY||stage.runtime?.releaseId!==envelope.runtime.releaseId||stage.runtime?.manifestUrl!==envelope.runtime.manifestUrl||stage.runtime?.manifestSha256!==envelope.runtime.manifestSha256||stage.runtime?.runtimeManifestSha256!==envelope.runtime.runtimeManifestSha256) throw Error('staging evidence is not bound to this exact candidate run and runtime');
          if(JSON.stringify(stage.npmRegistry)!==JSON.stringify(npmRegistry)) throw Error('staging evidence is not bound to the current immutable npm publication');
          const expected=['full-r2-cas-verification','current-worker-release-host','current-worker-resource-broker','current-worker-release-bound-object-range'];
          if(JSON.stringify(stage.checks)!==JSON.stringify(expected)) throw Error('staging evidence does not contain the complete compatibility gate');
          NODE
      - name: Detect optional repository-scoped Piwork read credentials
        id: piwork-app
        env:
          PIWORK_READ_APP_ID: ${{ secrets.ONLYOFFICE_RELEASE_READ_APP_ID }}
          PIWORK_READ_APP_PRIVATE_KEY: ${{ secrets.ONLYOFFICE_RELEASE_READ_APP_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if test -n "${PIWORK_READ_APP_ID}" && test -n "${PIWORK_READ_APP_PRIVATE_KEY}"; then
            echo "enabled=true" >> "${GITHUB_OUTPUT}"
          elif test -z "${PIWORK_READ_APP_ID}" && test -z "${PIWORK_READ_APP_PRIVATE_KEY}"; then
            echo "enabled=false" >> "${GITHUB_OUTPUT}"
          else
            echo "::error title=Incomplete Piwork read credentials::Configure both optional GitHub App secrets or neither."
            exit 1
          fi
      - name: Mint a repository-scoped Piwork read token
        if: steps.piwork-app.outputs.enabled == 'true'
        id: piwork-read-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.1
        with:
          app-id: ${{ secrets.ONLYOFFICE_RELEASE_READ_APP_ID }}
          private-key: ${{ secrets.ONLYOFFICE_RELEASE_READ_APP_PRIVATE_KEY }}
          owner: agentbridges-ai
          repositories: pi-work
          permission-actions: read
          permission-contents: read
          permission-pull-requests: read
      - name: Require successful Piwork integration evidence for this candidate
        env:
          PIWORK_COMMIT: ${{ inputs.piwork_integration_commit }}
          PIWORK_RUN_ID: ${{ inputs.piwork_integration_run_id }}
          PIWORK_RUN_ATTEMPT: ${{ inputs.piwork_integration_run_attempt }}
          CANDIDATE: ${{ inputs.candidate_commit }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          PIWORK_READ_TOKEN: ${{ steps.piwork-read-token.outputs.token }}
        run: |
          set -euo pipefail
          [[ "${PIWORK_COMMIT}" =~ ^[a-f0-9]{40}$ ]]
          [[ "${PIWORK_RUN_ATTEMPT}" =~ ^[1-9][0-9]*$ ]]
          GITHUB_API_HEADERS=(-H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28')
          if test -n "${PIWORK_READ_TOKEN}"; then
            GITHUB_API_HEADERS+=(-H "Authorization: Bearer ${PIWORK_READ_TOKEN}")
          fi
          github_api_get() {
            local url="$1" output="$2" headers="$3" status limit remaining reset
            : > "${headers}"
            if ! status="$(curl --silent --show-error --retry 4 --retry-all-errors --connect-timeout 10 --max-time 30 \
              --dump-header "${headers}" --output "${output}" --write-out '%{http_code}' \
              "${GITHUB_API_HEADERS[@]}" "${url}")"; then
              status="${status:-000}"
            fi
            if [[ "${status}" =~ ^2[0-9][0-9]$ ]]; then
              return 0
            fi
            limit="$(awk -F': *' 'tolower($1)=="x-ratelimit-limit"{gsub("\\r","",$2);print $2}' "${headers}" | tail -1)"
            remaining="$(awk -F': *' 'tolower($1)=="x-ratelimit-remaining"{gsub("\\r","",$2);print $2}' "${headers}" | tail -1)"
            reset="$(awk -F': *' 'tolower($1)=="x-ratelimit-reset"{gsub("\\r","",$2);print $2}' "${headers}" | tail -1)"
            echo "::error title=Piwork GitHub API request failed::HTTP ${status}; x-ratelimit-limit=${limit:-unknown}, remaining=${remaining:-unknown}, reset=${reset:-unknown}. Configure the optional Piwork read GitHub App when anonymous quota is insufficient."
            return 1
          }
          raw_get() {
            local url="$1" output="$2"
            local args=(--fail --silent --show-error --retry 4 --retry-all-errors --connect-timeout 10 --max-time 30)
            if test -n "${PIWORK_READ_TOKEN}"; then
              args+=(-H "Authorization: Bearer ${PIWORK_READ_TOKEN}")
            fi
            curl "${args[@]}" "${url}" --output "${output}"
          }
          github_api_get \
            "https://api.github.com/repos/agentbridges-ai/pi-work/actions/runs/${PIWORK_RUN_ID}/attempts/${PIWORK_RUN_ATTEMPT}" \
            piwork-run.json piwork-run.headers
          raw_get \
            "https://raw.githubusercontent.com/agentbridges-ai/pi-work/${PIWORK_COMMIT}/release/onlyoffice-release-manifest.json" \
            piwork-onlyoffice-release.json
          github_api_get \
            "https://api.github.com/repos/agentbridges-ai/pi-work/actions/runs/${PIWORK_RUN_ID}/attempts/${PIWORK_RUN_ATTEMPT}/jobs?per_page=100" \
            piwork-jobs.json piwork-jobs.headers
          node <<'NODE'
          const run=require('./piwork-run.json'); const descriptor=require('./piwork-onlyoffice-release.json'); const envelope=require('./candidate-input/release-evidence/office-release-envelope.json'); const npmRegistry=require('./verified-npm-registry.json');
          if(run.id!==Number(process.env.PIWORK_RUN_ID)||run.run_attempt!==Number(process.env.PIWORK_RUN_ATTEMPT)||run.conclusion!=='success'||run.head_sha!==process.env.PIWORK_COMMIT||run.event!=='workflow_dispatch'||run.repository?.full_name!=='agentbridges-ai/pi-work'||!run.path.endsWith('/deep-verify.yml')) throw Error('Piwork evidence is not the exact successful dispatched deep-verify run attempt for this commit');
          if(descriptor.lifecycle!=='candidate'||descriptor.runtimeIdentity?.sourceCommit!==envelope.source.gitCommit||descriptor.runtimeIdentity?.hostBuildId!==envelope.runtime.protocolHostBuildId||descriptor.releaseManifest?.hostBuildId!==envelope.runtime.hostBuildId||descriptor.releaseManifest?.releaseId!==envelope.runtime.releaseId||descriptor.releaseManifest?.sha256!==envelope.runtime.manifestSha256||descriptor.runtimeIdentity?.assetManifestDigest!==envelope.runtime.runtimeManifestSha256||descriptor.npmPackage?.name!==envelope.npm.packageName||descriptor.npmPackage?.version!==envelope.npm.version||descriptor.npmPackage?.integrity!==npmRegistry.integrity||descriptor.npmPackage?.gitHead!==npmRegistry.gitHead||descriptor.npmPackage?.sourceCommit!==npmRegistry.gitHead) throw Error('Piwork integration descriptor is not bound to this runtime candidate and npm publication');
          const expectedJob=`OnlyOffice candidate integration / ${envelope.runtime.releaseId}`; if(!require('./piwork-jobs.json').jobs?.some(job=>job.name===expectedJob&&job.conclusion==='success')) throw Error(`Piwork dispatched candidate integration job did not succeed: ${expectedJob}`);
          NODE
          github_api_get \
            "https://api.github.com/repos/agentbridges-ai/pi-work/commits/${PIWORK_COMMIT}/pulls" \
            piwork-pulls.json piwork-pulls.headers
          node <<'NODE'
          const prs=require('./piwork-pulls.json').filter(pr=>pr.state==='open'&&pr.base?.ref==='main'&&pr.head?.sha===process.env.PIWORK_COMMIT&&pr.head?.repo?.full_name==='agentbridges-ai/pi-work');
          if(prs.length!==1) throw Error(`Piwork integration must have exactly one open same-repository PR on main, found ${prs.length}`);
          NODE
          for protected in .github/workflows/deep-verify.yml .github/actions/setup-toolchain/action.yml scripts/verify-onlyoffice-release.mjs Makefile; do
            raw_get "https://raw.githubusercontent.com/agentbridges-ai/pi-work/main/${protected}" "baseline-${protected//\//-}";
            raw_get "https://raw.githubusercontent.com/agentbridges-ai/pi-work/${PIWORK_COMMIT}/${protected}" "candidate-${protected//\//-}";
            cmp "baseline-${protected//\//-}" "candidate-${protected//\//-}" || { echo "Piwork integration may not modify ${protected}" >&2; exit 1; }
          done
      - name: Install deployment tools only
        run: sudo apt-get update && sudo apt-get install --yes rclone
      - name: Persist or recover immutable pointer and Worker promotion intent
        env:
          PIWORK_COMMIT: ${{ inputs.piwork_integration_commit }}
          PIWORK_RUN_ID: ${{ inputs.piwork_integration_run_id }}
          PIWORK_RUN_ATTEMPT: ${{ inputs.piwork_integration_run_attempt }}
          CANDIDATE: ${{ inputs.candidate_commit }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          STAGING_RUN_ID: ${{ inputs.staging_run_id }}
        run: |
          set -euo pipefail
          retry_rclone() { local attempt=1; until timeout 120 rclone "$@"; do test "$attempt" -ge 4 && return 1; sleep "$((attempt++ * 3))"; done; }
          retry_rclone copyto r2:onlyoffice-getpi-work/channels/stable-v5.json stable-v5-before-deploy.json
          npx --yes wrangler@4.114.0 deployments status --json > worker-deployment-before.json
          RELEASE_ID="$(node -p "require('./candidate-input/release-evidence/office-release-envelope.json').runtime.releaseId")"
          ASSET_VERSION="$(node scripts/runtime-asset-version.mjs --root candidate-input/dist --font-manifest candidate-input/dist/onlyoffice-browser-font-assets.json)"
          INTENT_PATH="promotion-intents/${RELEASE_ID}/${CANDIDATE}.json"
          export INTENT_PATH
          download_intent() {
            local temporary="${RUNNER_TEMP}/promotion-intent.json"
            rm -f "${temporary}" promotion-intent.json
            if ! timeout 120 rclone cat "r2:onlyoffice-getpi-work/${INTENT_PATH}" > "${temporary}"; then
              rm -f "${temporary}"
              return 1
            fi
            if ! test -s "${temporary}"; then
              rm -f "${temporary}"
              return 1
            fi
            if ! mv "${temporary}" promotion-intent.json; then
              rm -f "${temporary}"
              return 1
            fi
          }
          if download_intent 2>/dev/null; then
            echo "Recovering the immutable promotion intent at ${INTENT_PATH}"
          else
            PREVIOUS_WORKER_VERSION_ID="$(node - <<'NODE'
          const deployment=require('./worker-deployment-before.json');
          const uuid=/^[a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12}$/;
          if(!deployment.id||deployment.versions?.length!==1||deployment.versions[0]?.percentage!==100||!uuid.test(deployment.versions[0]?.version_id||'')) throw Error('new promotion must begin with one valid Worker version at 100%');
          process.stdout.write(deployment.versions[0].version_id);
          NODE
            )"
            rm -f "${RUNNER_TEMP}/worker-upload.ndjson"
            WRANGLER_OUTPUT_FILE_PATH="${RUNNER_TEMP}/worker-upload.ndjson" npx --yes wrangler@4.114.0 versions upload \
              --strict \
              --tag "candidate-${CANDIDATE}" \
              --message "OnlyOffice ${RELEASE_ID} candidate ${CANDIDATE}" \
              --var "ASSET_VERSION:${ASSET_VERSION}"
            CANDIDATE_WORKER_VERSION_ID="$(node - "${RUNNER_TEMP}/worker-upload.ndjson" <<'NODE'
          const fs=require('node:fs'); const file=process.argv[2]; const uuid=/^[a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12}$/;
          const uploads=fs.readFileSync(file,'utf8').trim().split('\n').filter(Boolean).map(line=>JSON.parse(line)).filter(entry=>entry.type==='version-upload'&&entry.version===1);
          if(uploads.length!==1||uploads[0].worker_name!=='onlyoffice-browser-runtime'||!uuid.test(uploads[0].version_id||'')) throw Error('Wrangler did not report one valid source-matched Worker version upload');
          process.stdout.write(uploads[0].version_id);
          NODE
            )"
            export PREVIOUS_WORKER_VERSION_ID CANDIDATE_WORKER_VERSION_ID RELEASE_ID ASSET_VERSION
            node <<'NODE'
          const fs=require('node:fs'); const envelope=require('./candidate-input/release-evidence/office-release-envelope.json'); const previousStable=require('./stable-v5-before-deploy.json');
          const id=name=>{const value=Number(process.env[name]);if(!Number.isSafeInteger(value)||value<1)throw Error(`${name} must be a positive safe integer`);return value};
          const validPointer=value=>value?.version===1&&/^[a-zA-Z0-9._+-]{1,128}$/.test(value.releaseId||'')&&value.manifestUrl===`/releases/${value.releaseId}/manifest.json`&&/^[a-f0-9]{64}$/.test(value.manifestSha256||'');
          if(!validPointer(previousStable)) throw Error('invalid stable-v5 baseline');
          const intent={version:1,trustRoot:'protected-production-workflow-and-r2-cas',candidate:{commit:process.env.CANDIDATE,runId:id('CANDIDATE_RUN_ID')},staging:{runId:id('STAGING_RUN_ID')},piwork:{commit:process.env.PIWORK_COMMIT,deepVerifyRunId:id('PIWORK_RUN_ID'),deepVerifyRunAttempt:id('PIWORK_RUN_ATTEMPT')},previousStable,worker:{name:'onlyoffice-browser-runtime',previousVersionId:process.env.PREVIOUS_WORKER_VERSION_ID,candidateVersionId:process.env.CANDIDATE_WORKER_VERSION_ID},runtimeRoot:{mode:'stable-v5-release-cas'},runtime:{releaseId:envelope.runtime.releaseId,manifestUrl:envelope.runtime.manifestUrl,manifestSha256:envelope.runtime.manifestSha256,runtimeManifestSha256:envelope.runtime.runtimeManifestSha256},repository:process.env.GITHUB_REPOSITORY};
          fs.writeFileSync('promotion-intent-proposed.json',JSON.stringify(intent,null,2)+'\n');
          NODE
            retry_rclone copyto promotion-intent-proposed.json "r2:onlyoffice-getpi-work/${INTENT_PATH}" --ignore-existing
          fi
          if ! test -s promotion-intent.json; then
            download_intent
          fi
          test -s promotion-intent.json
          node <<'NODE'
          const fs=require('node:fs'); const intent=require('./promotion-intent.json'); const current=require('./stable-v5-before-deploy.json'); const envelope=require('./candidate-input/release-evidence/office-release-envelope.json'); const deployment=require('./worker-deployment-before.json');
          const pointer=value=>({version:1,releaseId:value.releaseId,manifestUrl:value.manifestUrl,manifestSha256:value.manifestSha256});
          const same=(left,right)=>JSON.stringify(pointer(left))===JSON.stringify(pointer(right));
          const uuid=/^[a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12}$/;
          const id=name=>{const value=Number(process.env[name]);if(!Number.isSafeInteger(value)||value<1)throw Error(`${name} must be a positive safe integer`);return value};
          const expected={version:1,trustRoot:'protected-production-workflow-and-r2-cas',candidate:{commit:process.env.CANDIDATE,runId:id('CANDIDATE_RUN_ID')},staging:{runId:id('STAGING_RUN_ID')},piwork:{commit:process.env.PIWORK_COMMIT,deepVerifyRunId:id('PIWORK_RUN_ID'),deepVerifyRunAttempt:id('PIWORK_RUN_ATTEMPT')},runtimeRoot:{mode:'stable-v5-release-cas'},runtime:{releaseId:envelope.runtime.releaseId,manifestUrl:envelope.runtime.manifestUrl,manifestSha256:envelope.runtime.manifestSha256,runtimeManifestSha256:envelope.runtime.runtimeManifestSha256},repository:process.env.GITHUB_REPOSITORY};
          for(const field of ['version','trustRoot','candidate','staging','piwork','runtimeRoot','runtime','repository']) if(JSON.stringify(intent[field])!==JSON.stringify(expected[field])) throw Error(`immutable promotion intent ${field} mismatch`);
          if(!/^[a-zA-Z0-9._+-]{1,128}$/.test(intent.previousStable?.releaseId||'')||intent.previousStable?.manifestUrl!==`/releases/${intent.previousStable.releaseId}/manifest.json`||!/^[a-f0-9]{64}$/.test(intent.previousStable?.manifestSha256||'')) throw Error('immutable promotion intent has an invalid previous stable pointer');
          if(intent.worker?.name!=='onlyoffice-browser-runtime'||!uuid.test(intent.worker.previousVersionId||'')||!uuid.test(intent.worker.candidateVersionId||'')||intent.worker.previousVersionId===intent.worker.candidateVersionId) throw Error('immutable promotion intent has invalid Worker versions');
          const traffic=new Map((deployment.versions||[]).map(entry=>[entry.version_id,entry.percentage]));
          const workerState=traffic.size===1&&traffic.get(intent.worker.previousVersionId)===100?'previous':traffic.size===1&&traffic.get(intent.worker.candidateVersionId)===100?'candidate':traffic.size===2&&traffic.get(intent.worker.previousVersionId)===100&&traffic.get(intent.worker.candidateVersionId)===0?'split':null;
          const matchesPrevious=same(current,intent.previousStable),matchesCandidate=same(current,intent.runtime);
