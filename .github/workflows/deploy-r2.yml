          if(!response.ok) throw Error(`promotion receipt returned HTTP ${response.status}`);
          const bytes=Buffer.from(await response.arrayBuffer()); const sha=crypto.createHash('sha256').update(bytes).digest('hex');
          if(!bytes.equals(fs.readFileSync(process.env.PROMOTION_RECEIPT_FILE))||sha!==process.env.PROMOTION_RECEIPT_SHA256||!/(?:^|,)\s*immutable(?:,|$)/.test(response.headers.get('cache-control')||'')) throw Error('public promotion receipt bytes, digest, or immutable cache policy mismatch');
          NODE
          {
            echo "### Production promotion receipt"
            echo "- URL: \`https://onlyoffice.getpi.work/${PROMOTION_RECEIPT_PATH}\`"
            echo "- SHA-256: \`${PROMOTION_RECEIPT_SHA256}\`"
          } >> "${GITHUB_STEP_SUMMARY}"
      - name: Retain production promotion receipt
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: onlyoffice-production-promotion-receipt-${{ inputs.candidate_commit }}
          path: promotion-receipt
          if-no-files-found: error
          retention-days: 90
