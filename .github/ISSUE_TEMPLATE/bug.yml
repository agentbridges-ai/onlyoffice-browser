name: Bug report
description: Report a reproducible browser editor or integration problem
title: "bug: "
body:
  - type: markdown
    attributes:
      value: |
        Do not disclose security vulnerabilities here. Use the private security report link instead.
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
    validations:
      required: true
